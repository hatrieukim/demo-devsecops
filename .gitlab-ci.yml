# Run pipelines for merge requests and for the default branch only,
# so a push to an MR branch does not start two pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Security scanners maintained by GitLab. Each template adds one or more jobs.
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml      # leaked passwords, keys, tokens
  - template: Jobs/SAST.gitlab-ci.yml                  # dangerous patterns in source code
  - template: Jobs/SAST-IaC.gitlab-ci.yml              # misconfigured Dockerfile / infra files
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml # known CVEs in Python libraries
  - template: Jobs/Container-Scanning.gitlab-ci.yml    # known CVEs inside the Docker image
  - template: Security/DAST.gitlab-ci.yml              # attack the running app from outside

variables:
  # Our workflow only runs merge request pipelines, so the scanners must too
  AST_ENABLE_MR_PIPELINES: "true"

  # TEMPORARY: lint, tests and all security scanners are switched off to keep
  # the pipeline fast. Delete the six lines below to switch them back on.
  VERIFY_DISABLED: "true"
  SAST_DISABLED: "true"
  SECRET_DETECTION_DISABLED: "true"
  DEPENDENCY_SCANNING_DISABLED: "true"
  CONTAINER_SCANNING_DISABLED: "true"
  DAST_DISABLED: "true"

stages:
  - lint
  - test       # also: secret detection, SAST, IaC, dependency scanning
  - build
  - scan       # container scanning (needs the built image)
  - dast       # DAST (needs the running app)
  - staging    # automatic deploy after a merge to main
  - production # manual deploy, needs approval

default:
  image: python:3.12-slim

lint:
  rules:
    - if: $VERIFY_DISABLED != "true"
  stage: lint
  script:
    - pip install --quiet ruff==0.16.10
    # Machine-readable report for the Code Quality widget on the MR
    - ruff check . --exit-zero --output-format=gitlab > gl-code-quality-report.json
    # Human-readable output; fails the job if there are findings
    - ruff check .
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json

test:
  rules:
    - if: $VERIFY_DISABLED != "true"
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: app
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    DATABASE_URL: postgresql://app:app@postgres:5432/app
  script:
    - pip install --quiet -r requirements-dev.txt
    - pytest --junitxml=report.xml --cov=app --cov-report=term --cov-report=xml:coverage.xml
  # Regex that pulls the total % from pytest-cov output into the MR and pipeline
  coverage: '/TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build-image:
  stage: build
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    # Sanity check: the app can be imported inside the image
    - docker run --rm "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" python -c "import app.main"
    # Always push the commit tag: container scanning and DAST pull this exact image
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    # "latest" moves only when code lands on main
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi

# --- Overrides for the included security jobs --------------------------------

container_scanning:
  stage: scan
  variables:
    CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

dast:
  # Start the image we just built as a service, then scan it
  services:
    - name: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
      alias: app
  variables:
    DAST_TARGET_URL: http://app:8000/docs

# --- Deploy ------------------------------------------------------------------
# The target is "kimlab", a machine that is only reachable over Tailscale.
# The job joins the tailnet as a short-lived node, then SSHes in. The SSH key
# is locked to one script on kimlab, which takes "<environment> <image tag>".
# See deploy/README.md. These jobs only exist on main.

.deploy:
  image: alpine:3.22
  variables:
    GIT_STRATEGY: none          # nothing from the repo is needed, only variables
    DEPLOY_SSH_USER: kim_it
  before_script:
    - '[ -n "$TS_AUTHKEY" ] || { echo "CI/CD variable TS_AUTHKEY is not set"; exit 1; }'
    - apk add --no-cache --quiet tailscale openssh-client
    # Userspace networking: CI containers have no TUN device
    - mkdir -p /var/run/tailscale
    - 'tailscaled --tun=userspace-networking --state=mem: > /tmp/tailscaled.log 2>&1 &'
    - for i in $(seq 1 20); do [ -S /var/run/tailscale/tailscaled.sock ] && break; sleep 0.5; done
    - tailscale up --auth-key="$TS_AUTHKEY" --hostname="gitlab-ci-$CI_JOB_ID" --accept-dns=false --timeout=60s
    - install -m 700 -d ~/.ssh
    - echo "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
    # Pinned host key, so the job cannot be pointed at an impostor machine
    - echo "$KIMLAB_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - >
      ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes
      -o ProxyCommand="tailscale nc %h %p"
      "$DEPLOY_SSH_USER@$KIMLAB_IP" "$CI_ENVIRONMENT_NAME $CI_COMMIT_SHORT_SHA"
  after_script:
    # Remove the short-lived node from the tailnet right away
    - tailscale logout || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-staging:
  extends: .deploy
  stage: staging
  environment:
    name: staging
    url: http://$KIMLAB_IP:8101/docs

deploy-production:
  extends: .deploy
  stage: production
  environment:
    name: production
    url: http://$KIMLAB_IP:8100/docs
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
